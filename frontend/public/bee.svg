<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 徽章背景渐变 -->
    <radialGradient id="badgeGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <!-- 徽章内圈渐变 -->
    <radialGradient id="innerGrad" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </radialGradient>
    <!-- 蜜蜂身体渐变 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <!-- 金色条纹渐变 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- 翅膀渐变 -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.6"/>
    </linearGradient>
    <!-- 高光渐变 -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 外圈徽章 -->
  <circle cx="64" cy="64" r="60" fill="url(#badgeGrad)" filter="url(#shadow)"/>
  <!-- 外圈高光 -->
  <ellipse cx="64" cy="42" rx="48" ry="22" fill="url(#shineGrad)" opacity="0.3"/>
  <!-- 内圈 -->
  <circle cx="64" cy="64" r="48" fill="url(#innerGrad)"/>
  <!-- 内圈边框 -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>

  <!-- 蜜蜂身体 -->
  <g filter="url(#softShadow)" transform="translate(64, 66)">
    <!-- 左翅膀 -->
    <ellipse cx="-14" cy="-16" rx="14" ry="10" fill="url(#wingGrad)" stroke="#bae6fd" stroke-width="0.8" transform="rotate(-25, -14, -16)"/>
    <!-- 右翅膀 -->
    <ellipse cx="14" cy="-16" rx="14" ry="10" fill="url(#wingGrad)" stroke="#bae6fd" stroke-width="0.8" transform="rotate(25, 14, -16)"/>

    <!-- 头部 -->
    <ellipse cx="0" cy="-14" rx="9" ry="8" fill="url(#bodyGrad)"/>
    <!-- 眼睛 -->
    <ellipse cx="-3.5" cy="-15" rx="1.8" ry="2" fill="#fff"/>
    <ellipse cx="3.5" cy="-15" rx="1.8" ry="2" fill="#fff"/>
    <circle cx="-3.5" cy="-14.5" r="1" fill="#1f2937"/>
    <circle cx="3.5" cy="-14.5" r="1" fill="#1f2937"/>
    <!-- 触角 -->
    <path d="M -4 -21 Q -7 -26 -5 -29" stroke="#1f2937" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M 4 -21 Q 7 -26 5 -29" stroke="#1f2937" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <circle cx="-5" cy="-29" r="1.2" fill="#f59e0b"/>
    <circle cx="5" cy="-29" r="1.2" fill="#f59e0b"/>

    <!-- 胸部 -->
    <ellipse cx="0" cy="-4" rx="10" ry="8" fill="url(#bodyGrad)"/>

    <!-- 腹部 -->
    <ellipse cx="0" cy="10" rx="12" ry="14" fill="url(#bodyGrad)"/>
    <!-- 金色条纹1 -->
    <path d="M -11 5 Q 0 2 11 5 L 11 9 Q 0 6 -11 9 Z" fill="url(#goldGrad)"/>
    <!-- 金色条纹2 -->
    <path d="M -11.5 12 Q 0 9 11.5 12 L 11.5 16 Q 0 13 -11.5 16 Z" fill="url(#goldGrad)"/>
    <!-- 金色条纹3 -->
    <path d="M -10 19 Q 0 16 10 19 L 10 22 Q 0 19 -10 22 Z" fill="url(#goldGrad)"/>
    <!-- 腹部高光 -->
    <ellipse cx="-4" cy="8" rx="3" ry="6" fill="#fff" opacity="0.12"/>

    <!-- 毒针 -->
    <path d="M 0 23 L -2 27 L 2 27 Z" fill="#1f2937"/>

    <!-- 腿 -->
    <path d="M -8 -2 L -13 2" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 8 -2 L 13 2" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M -9 4 L -14 8" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 9 4 L 14 8" stroke="#1f2937" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- 底部蜂巢装饰 -->
  <g opacity="0.15" transform="translate(64, 105)">
    <polygon points="-18,0 -9,-5.2 0,0 0,6 -9,11.2 -18,6" fill="#92400e"/>
    <polygon points="0,0 9,-5.2 18,0 18,6 9,11.2 0,6" fill="#92400e"/>
    <polygon points="-9,-10.4 0,-15.6 9,-10.4 9,-5.2 0,0 -9,-5.2" fill="#92400e"/>
  </g>
</svg>
